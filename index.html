      content: "";
      position: absolute;
      pointer-events: none;
    }

      left: 0;
      right: 0;
      top: 0;
      height: 1px;

    .spec-card {

      margin-bottom: 0.9rem;

    .spec-img {

      object-fit: cover;
      object-position: center;

      box-shadow: 0 10px 22px rgba(0,0,0,0.5);

    .spec-gallery-title {
      margin-top: 1.1rem;

      font-size: 0.9rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;

    .spec-gallery {
      margin-top: 0.2rem;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.8rem;
      width: 100%;

    .spec-gallery img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      object-position: center;
      border-radius: 0.8rem;
      border: 1px solid rgba(148,163,184,0.4);
      background: rgba(255,255,255,0.03);
      box-shadow: 0 10px 22px rgba(0,0,0,0.5);

      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .spec-title {
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 0.1rem;
      color: #e5e7eb;
    }

    .spec-tagline {
      font-size: 0.85rem;
      color: #9ca3af;
      margin-bottom: 0.3rem;
      line-height: 1.6;

    .spec-download {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.34rem 0.76rem;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      text-decoration: none;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.75);
      color: #e5e7eb;
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.7);
      transition: all 0.2s ease;

    .spec-download::before {
      content: "⬇";
      font-size: 0.85rem;
    }

    .spec-download:hover {
      background: rgba(30, 64, 175, 0.9);
      border-color: rgba(191, 219, 254, 0.9);
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.9);
      transform: translateY(-1px);
    }

    .spec-list {
      margin: 0;
      padding: 0;
    }

    .spec-list div {
      display: grid;
      grid-template-columns: minmax(0, 40%) minmax(0, 60%);
      column-gap: 0.7rem;
      margin-bottom: 0.45rem;
      opacity: 0;
      transform: translateY(6px);
    }

    .spec-list dt {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9ca3af;

    .spec-list dd {
      margin: 0;
      font-size: 0.83rem;
      color: #e5e7eb;
      line-height: 1.55;
    }

    .detalii-card.active .spec-list div {
      animation: specRowIn 0.35s ease-out forwards;
    }

    .detalii-card.active .spec-list div:nth-child(1) { animation-delay: 0.02s; }
    .detalii-card.active .spec-list div:nth-child(2) { animation-delay: 0.05s; }
    .detalii-card.active .spec-list div:nth-child(3) { animation-delay: 0.08s; }
    .detalii-card.active .spec-list div:nth-child(4) { animation-delay: 0.11s; }
    .detalii-card.active .spec-list div:nth-child(5) { animation-delay: 0.14s; }
    .detalii-card.active .spec-list div:nth-child(6) { animation-delay: 0.17s; }
    .detalii-card.active .spec-list div:nth-child(7) { animation-delay: 0.20s; }
    .detalii-card.active .spec-list div:nth-child(8) { animation-delay: 0.23s; }
    .detalii-card.active .spec-list div:nth-child(9) { animation-delay: 0.26s; }
    .detalii-card.active .spec-list div:nth-child(10) { animation-delay: 0.29s; }
    .detalii-card.active .spec-list div:nth-child(11) { animation-delay: 0.32s; }
    .detalii-card.active .spec-list div:nth-child(12) { animation-delay: 0.35s; }
